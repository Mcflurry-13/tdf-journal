<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambient Display · Wiring Guide</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#263747;font:14px system-ui,sans-serif}header{padding:22px 28px;background:white;border-bottom:1px solid #dfe4e8;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:23px;margin:0 0 5px}p{margin:0;color:#62717d}.badge{font-size:12px;border:1px solid #ccd6dc;border-radius:20px;padding:7px 12px}main{display:grid;grid-template-columns:minmax(0,1fr);height:calc(100vh - 91px)}.canvas{min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:8px;padding:12px 20px;flex-wrap:wrap}button{font:inherit;background:white;border:1px solid #ccd5dd;border-radius:9px;padding:9px 12px;color:inherit;cursor:pointer}button:focus-visible,summary:focus-visible{outline:3px solid #197ac9;outline-offset:2px}button:hover{background:#edf3f6}button[aria-pressed=true]{background:#243e4b;color:white;border-color:#243e4b}.viewer{overflow:auto;flex:1;min-height:250px;padding:10px}svg{display:block;width:100%;height:auto;background:#f7f8fa;border-radius:12px}.wire{cursor:pointer;outline:none}.hit{stroke:transparent;stroke-width:28;fill:none;pointer-events:stroke}.wire:focus .hit,.wire:hover .hit{stroke:#70a9ce55}.ink,.end{pointer-events:none}.veil{pointer-events:none;transition:opacity .15s}aside{border-left:1px solid #dce3e8;background:white;overflow:auto;padding:20px}.notice{background:#fff4ea;color:#7c4c20;padding:12px;border-radius:9px;font-size:12px;line-height:1.6;margin-bottom:16px}#detail{border:1px solid #d4e0e4;border-radius:12px;padding:14px;margin-bottom:15px;min-height:102px}#detail strong{font-size:17px;display:block;margin:5px 0}#detail small{color:#687b85}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.filters button{font-size:12px;padding:7px 9px}.row{display:flex;align-items:center;gap:8px;margin-bottom:6px}.row>button{flex:1;text-align:left;padding:9px}.row input{width:17px;height:17px;accent-color:#287b60}.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}.row small{display:block;font-size:11px;margin:3px 0 0 15px;opacity:.75}#progress{font-size:12px}.foot{font-size:12px;line-height:1.6;color:#6a7b84;margin-top:14px}#zoomLabel{min-width:45px;text-align:center}.nav{display:flex;gap:8px;margin-bottom:10px}.nav button{flex:1}@media(max-width:850px){header{padding:16px}main{display:flex;flex-direction:column;height:auto}.viewer{height:65vh;flex:auto}aside{border-left:0}.badge{display:none}}@media print{header,.toolbar,aside{display:none}main{display:block;height:auto}.viewer{overflow:visible;padding:0}svg{width:100%!important}.veil{opacity:0!important}}
#detail{border:0;padding:0;margin:0 0 0 12px;min-height:0;font-size:13px;color:#62717d}@media(max-width:850px){main{height:calc(100dvh - 100px)}.canvas{flex:1;min-height:0}.viewer{height:auto;flex:1}}

html.journal-embed header{display:none}
html.journal-embed main{height:100dvh;display:flex;flex-direction:column}
html.journal-embed .canvas{flex:1;min-height:0}
html.journal-embed .viewer{height:auto;flex:1}
html.journal-embed .toolbar{padding:12px;gap:6px}
html.journal-embed #detail{flex-basis:100%;margin:4px 0 0;min-height:32px;line-height:1.4}
html.journal-embed button{border-radius:0;font-size:12px;padding:7px 9px}
html.journal-embed #print{display:none}
</style><script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('journal-embed');</script>
<header><div><h1>Ambient Display · Wiring Guide</h1><p>Interactive breadboard wiring · Select a wire to trace its connections.</p></div><span class="badge">Wiring guide only · No hardware control</span></header>
<main><section class="canvas"><div class="toolbar"><button id="out" aria-label="Zoom out">−</button><span id="zoomLabel">100%</span><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="all">Show all wires</button><button id="print">Print</button><span id="detail" aria-live="polite">Select a wire to see its endpoints.</span></div><div class="viewer"><svg id="diagram" viewBox="0 0 2200 1740" aria-label="Feather ESP32 V2 breadboard wiring"><image href="diagram.png" width="2200" height="1740"/><rect class="veil" width="2200" height="1740" fill="#f7f8fa" opacity="0"/><g id="wires"></g></svg></div></section>
</main>
<script>
const wires=[{"name": "Servo signal", "start": "Servo signal", "end": "I16", "group": "servo", "color": "#e58b20", "points": [[340, 570], [520, 570], [520, 810], [1190, 810]]}, {"name": "Servo power", "start": "Servo +5V", "end": "E21", "group": "power", "color": "#d84040", "points": [[340, 620], [490, 620], [490, 1010], [940, 1010], [940, 1010]]}, {"name": "Servo ground", "start": "Servo GND", "end": "E23", "group": "ground", "color": "#313c49", "points": [[340, 680], [460, 680], [460, 1090], [940, 1090], [940, 1090]]}, {"name": "Power bank +5V", "start": "Power bank +5V", "end": "A21", "group": "power", "color": "#d84040", "points": [[380, 1190], [550, 1190], [550, 1010], [740, 1010]]}, {"name": "Power bank ground", "start": "Power bank GND", "end": "A23", "group": "ground", "color": "#313c49", "points": [[380, 1225], [575, 1225], [575, 1090], [740, 1090]]}, {"name": "Feather common ground", "start": "A6", "end": "E28", "group": "ground", "color": "#313c49", "points": [[740, 410], [620, 410], [620, 1330], [940, 1330], [940, 1290]]}, {"name": "Ground bridge", "start": "C23", "end": "A28", "group": "ground", "color": "#313c49", "points": [[840, 1090], [810, 1120], [700, 1120], [700, 1290], [740, 1290]]}, {"name": "LED power branch", "start": "C21", "end": "F25", "group": "power", "color": "#d84040", "points": [[840, 1010], [840, 1040], [1018, 1040], [1018, 1170], [1040, 1170]]}, {"name": "LED ground branch", "start": "C28", "end": "F27", "group": "ground", "color": "#313c49", "points": [[840, 1290], [840, 1320], [1008, 1320], [1008, 1250], [1040, 1250]]}, {"name": "GPIO27 data jumper", "start": "J12", "end": "F23", "group": "data", "color": "#2878cb", "points": [[1240, 650], [1340, 650], [1340, 1110], [1040, 1110], [1040, 1090]]}, {"name": "330 ohm series resistor", "start": "G23", "end": "G20", "group": "data", "color": "#9a742c", "points": [[1090, 1090], [1090, 970]]}, {"name": "LED A power", "start": "H25", "end": "A +5V / red", "group": "power", "color": "#d84040", "points": [[1140, 1170], [1450, 1170], [1450, 960], [1610, 960]]}, {"name": "LED B power", "start": "J25", "end": "B +5V / brown", "group": "power", "color": "#8b5437", "points": [[1240, 1170], [1430, 1170], [1430, 1250], [1610, 1250]]}, {"name": "LED A ground", "start": "H27", "end": "A GND / black", "group": "ground", "color": "#313c49", "points": [[1140, 1250], [1475, 1250], [1475, 1010], [1610, 1010]]}, {"name": "LED B ground", "start": "J27", "end": "B GND / black", "group": "ground", "color": "#313c49", "points": [[1240, 1250], [1405, 1250], [1405, 1300], [1610, 1300]]}, {"name": "LED A data input", "start": "I20", "end": "A DIN / yellow", "group": "data", "color": "#b08b00", "points": [[1190, 970], [1500, 970], [1500, 1055], [1610, 1055]]}, {"name": "LED cascade", "start": "A DOUT", "end": "B DIN / green", "group": "data", "color": "#268e66", "points": [[2100, 1055], [2140, 1055], [2140, 1120], [1530, 1120], [1530, 1345], [1610, 1345]]}];const ns='http://www.w3.org/2000/svg';let selected=-1,zoom=1;
const $=s=>document.querySelector(s);function el(tag,attrs){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e}
wires.forEach((w,i)=>{const g=el('g',{class:'wire',tabindex:0,role:'button','aria-label':`${w.name}: ${w.start} to ${w.end}`});const points=w.points.map(p=>p.join(',')).join(' ');g.append(el('polyline',{class:'hit',points}));g.append(el('polyline',{class:'ink',points,fill:'none',stroke:'white','stroke-width':13,'stroke-linejoin':'round'}));g.append(el('polyline',{class:'ink',points,fill:'none',stroke:w.color,'stroke-width':7,'stroke-linejoin':'round'}));[w.points[0],w.points.at(-1)].forEach(p=>g.append(el('circle',{class:'end',cx:p[0],cy:p[1],r:13,fill:w.color,stroke:'white','stroke-width':4})));g.onclick=()=>choose(i);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i)}};$('#wires').append(g)});
function choose(i){selected=selected===i?-1:i;render()}
function render(){ $('.veil').setAttribute('opacity',selected>=0 ? 0.82 : 0);[...$('#wires').children].forEach((g,i)=>{g.querySelectorAll('.ink,.end').forEach(x=>x.setAttribute('opacity',i===selected?1:0));g.setAttribute('aria-pressed',i===selected)});const w=wires[selected];$('#detail').textContent=w?`${w.name}: ${w.start} → ${w.end}`:'Select a wire to see its endpoints.';}
function setZoom(v){zoom=Math.max(1,Math.min(3,v));$('#diagram').style.width=(zoom*100)+'%';$('#zoomLabel').textContent=Math.round(zoom*100)+'%'}
$('#in').onclick=()=>setZoom(zoom+.25);$('#out').onclick=()=>setZoom(zoom-.25);$('#fit').onclick=()=>setZoom(1);$('#all').onclick=()=>{selected=-1;render()};$('#print').onclick=()=>window.print();render();
</script></html>
