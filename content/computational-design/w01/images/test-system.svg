<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550"><title>Agent Studio experiment structure</title><rect width="900" height="550" fill="#f6f3ed"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#777"/></marker></defs><g font-family="Arial,sans-serif" fill="#30352f"><text x="36" y="45" font-size="24">One question, different design surfaces</text><text x="36" y="74" font-size="15" fill="#666">Actual test structure · Agent Design Studio · Mini-Me</text><g stroke="#bcc2b5"><rect x="36" y="110" width="260" height="90" fill="#fffdf8"/><rect x="36" y="225" width="260" height="90" fill="#fffdf8"/><rect x="36" y="340" width="260" height="90" fill="#fffdf8"/><rect x="370" y="210" width="220" height="120" fill="#e5eadd"/><rect x="665" y="210" width="200" height="120" fill="#fffdf8"/></g><g font-size="17"><text x="52" y="141">System instructions</text><text x="52" y="170" font-size="14">None → evidence-only rule</text><text x="52" y="256">Knowledge</text><text x="52" y="285" font-size="14">None → checked portfolio excerpt</text><text x="52" y="371">Fixed question</text><text x="52" y="400" font-size="14">Education, projects, methods, hobby</text><text x="390" y="247">Model response</text><text x="390" y="276" font-size="14">Model selection</text><text x="390" y="301" font-size="14">Temperature setting</text><text x="685" y="247">Evaluation</text><text x="685" y="276" font-size="14">Source-supported facts?</text><text x="685" y="301" font-size="14">Unknowns acknowledged?</text></g><text x="36" y="490" font-size="15" fill="#666">Fresh session per setup. One response per setup; no statistical reliability claim.</text></g><g fill="none" stroke="#777" stroke-width="1.4" marker-end="url(#arrow)"><path d="M296 155H330V245H369"/><path d="M296 270H369"/><path d="M296 385H330V295H369"/><path d="M590 270H664"/></g></svg>