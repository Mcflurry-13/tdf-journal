<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc"><title id="title">Proposed inspiration archive system</title><desc id="desc">A task and archive feed retrieval, then explanation and user review. This architecture has not been implemented.</desc><rect width="760" height="660" fill="#f6f3ed"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#77776d"/></marker></defs><g font-family="Arial, sans-serif" fill="#34372f"><text x="40" y="54" font-size="24">An archive that returns to the task</text><text x="40" y="85" font-size="14" fill="#72746b">PROPOSED SYSTEM · CONCEPT STAGE</text><rect x="40" y="130" width="300" height="112" rx="3" fill="#fffdf8" stroke="#bfc5b6"/><text x="60" y="158" font-size="14">01  TASK</text><text x="60" y="189" font-size="17">Current goal</text><text x="60" y="215" font-size="15" fill="#62675c">Selected archive</text><rect x="40" y="290" width="300" height="112" rx="3" fill="#fffdf8" stroke="#bfc5b6"/><text x="60" y="318" font-size="14">02  ARCHIVE</text><text x="60" y="349" font-size="17">Source content and links</text><text x="60" y="375" font-size="15" fill="#62675c">User notes kept separately</text><rect x="400" y="210" width="300" height="112" rx="3" fill="#e4e9df" stroke="#bfc5b6"/><text x="420" y="238" font-size="14">03  RETRIEVE</text><text x="420" y="269" font-size="17">Select relevant candidates</text><text x="420" y="295" font-size="15" fill="#62675c">Respect the chosen scope</text><rect x="400" y="390" width="300" height="112" rx="3" fill="#e4e9df" stroke="#bfc5b6"/><text x="420" y="418" font-size="14">04  EXPLAIN</text><text x="420" y="449" font-size="17">Relevance and possible uses</text><text x="420" y="475" font-size="15" fill="#62675c">Identify missing evidence</text><rect x="40" y="470" width="300" height="112" rx="3" fill="#fffdf8" stroke="#bfc5b6"/><text x="60" y="498" font-size="14">05  REVIEW</text><text x="60" y="529" font-size="17">User selects references</text><text x="60" y="555" font-size="15" fill="#62675c">Copy context into next AI</text></g><g fill="none" stroke="#77776d" stroke-width="1.5" marker-end="url(#a)"><path d="M340 186H370V245H399"/><path d="M340 346H370V290H399"/><path d="M550 322V389"/><path d="M400 446H370V526H341"/></g><text x="40" y="620" font-family="Arial, sans-serif" font-size="14" fill="#62675c">Sources remain visible. AI suggestions remain separate from source facts.</text></svg>