<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#666"/></marker></defs><rect width="1000" height="660" fill="#f6f5f1"/><g font-family="Arial,sans-serif" fill="#222"><text x="36" y="45" font-size="25">Writing assistant · intended system behavior</text><text x="36" y="75" font-size="15">Context inputs, model decisions, and user control</text><rect x="35" y="115" width="280" height="115" rx="4" fill="#eeece5" stroke="#aaa"/><text x="53" y="143" font-size="15" font-weight="bold">USER INPUT</text><text x="53" y="169" font-size="15">Specific experience and context</text><text x="53" y="192" font-size="15">Desired tone and recipient</text><text x="53" y="215" font-size="15">Additional details during drafting</text><rect x="360" y="115" width="280" height="115" rx="4" fill="#eeece5" stroke="#aaa"/><text x="378" y="143" font-size="15" font-weight="bold">SYSTEM INSTRUCTIONS</text><text x="378" y="169" font-size="15">Empathy and concise clarification</text><text x="378" y="192" font-size="15">No invented personal facts</text><text x="378" y="215" font-size="15">Drafting only; no real-world action</text><rect x="685" y="115" width="280" height="115" rx="4" fill="#eeece5" stroke="#aaa"/><text x="703" y="143" font-size="15" font-weight="bold">REFERENCE KNOWLEDGE</text><text x="703" y="169" font-size="15">Formal letter structure</text><text x="703" y="192" font-size="15">Creative recipient framing</text><text x="703" y="215" font-size="15">Context examples, not user facts</text><rect x="235" y="310" width="530" height="135" rx="4" fill="#e7e8f4" stroke="#aaa"/><text x="253" y="338" font-size="15" font-weight="bold">MODEL · PROBABILISTIC</text><text x="253" y="364" font-size="15">Listen → identify recipient → check missing inputs</text><text x="253" y="387" font-size="15">If essential facts are missing: ask for clarification</text><text x="253" y="410" font-size="15">Otherwise: draft using the supplied facts</text><rect x="235" y="520" width="530" height="105" rx="4" fill="#eeece5" stroke="#aaa"/><text x="253" y="548" font-size="15" font-weight="bold">USER REVIEW</text><text x="253" y="574" font-size="15">Read the letter → confirm facts → request changes</text><text x="253" y="597" font-size="15">Output remains a draft; no automatic sending</text></g><g fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#a)"><path d="M175 230V270H340V310"/><path d="M500 230V310"/><path d="M825 230V270H660V310"/><path d="M500 445V520"/><path d="M235 570H130V365H235"/></g></svg>