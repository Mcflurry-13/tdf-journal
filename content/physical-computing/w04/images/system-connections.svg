<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img"><title>Sunset Flower: information and electrical connections</title><desc>Forecast requests run on a Mac. USB carries data to an ESP32, whose pins control a servo and two chained LED sticks. A separate 5V source supplies the actuators; all grounds join.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#252925"/></marker></defs><rect width="100%" height="100%" fill="#f6f5f1"/><style>text{font-family:Arial,sans-serif;fill:#242824}.s{font-size:21px;fill:#555c56}.t{font-size:27px;font-weight:600}.k{font-size:19px;letter-spacing:2px;fill:#60675f}</style><text x="35" y="42" class="k">01 / FROM FORECAST TO PHYSICAL OUTPUT</text><rect x="35" y="75" width="285" height="135" fill="#f4e7cc" stroke="#858980"/><text x="55" y="112" class="t">Sunsethue</text><text x="55" y="145" class="s">Berkeley sunset forecast</text><text x="55" y="173" class="s">quality q: 0–1</text><rect x="405" y="75" width="305" height="135" fill="#eeede7" stroke="#858980"/><text x="425" y="112" class="t">Mac · Python</text><text x="425" y="145" class="s">HTTPS + date validation</text><text x="425" y="173" class="s">USB owner / API key local</text><path d="M320 140H405" fill="none" stroke="#252925" stroke-width="2.2" marker-end="url(#a)"/><text x="332" y="122" class="s">HTTPS</text><rect x="795" y="75" width="290" height="135" fill="#eeede7" stroke="#858980"/><text x="815" y="112" class="t">Browser controls</text><text x="815" y="145" class="s">Hold / Breathe / Stop</text><text x="815" y="173" class="s">Animated illustration</text><path d="M795 145H710" fill="none" stroke="#252925" stroke-width="2.2" marker-end="url(#a)"/><text x="725" y="125" class="s">HTTP</text><rect x="405" y="300" width="305" height="155" fill="#e4e9e1" stroke="#858980"/><text x="425" y="337" class="t">Feather ESP32 V2</text><text x="425" y="370" class="s">Validate packet + ACK</text><text x="425" y="398" class="s">GPIO14 → servo PWM</text><text x="425" y="426" class="s">GPIO27 → pixel data</text><path d="M560 210V300" fill="none" stroke="#252925" stroke-width="2.2" marker-end="url(#a)"/><text x="578" y="251" class="s">USB · JSON</text><text x="578" y="280" class="s">+ acknowledgment</text><rect x="35" y="525" width="330" height="135" fill="#eeede7" stroke="#858980"/><text x="55" y="562" class="t">MG90S servo</text><text x="55" y="595" class="s">Positional motion</text><text x="55" y="623" class="s">Wire linkage → petals</text><path d="M440 455V488H200V525" fill="none" stroke="#252925" stroke-width="2.2" marker-end="url(#a)"/><text x="52" y="483" class="s">GPIO14 · 50 Hz</text><rect x="485" y="525" width="285" height="135" fill="#f4e7cc" stroke="#858980"/><text x="505" y="562" class="t">LED stick A</text><text x="505" y="595" class="s">8 RGB pixels</text><text x="505" y="623" class="s">DIN → DOUT</text><rect x="845" y="525" width="240" height="135" fill="#f4e7cc" stroke="#858980"/><text x="865" y="562" class="t">LED stick B</text><text x="865" y="595" class="s">8 RGB pixels</text><text x="865" y="623" class="s">DIN; DOUT free</text><path d="M670 455V525" fill="none" stroke="#252925" stroke-width="2.2" marker-end="url(#a)"/><text x="690" y="484" class="s">GPIO27 → 330 Ω → DIN</text><path d="M770 592H845" fill="none" stroke="#252925" stroke-width="2.2" marker-end="url(#a)"/><text x="780" y="574" class="s">data</text><rect x="35" y="755" width="330" height="105" fill="#f4e7cc" stroke="#858980"/><text x="55" y="792" class="t">External 5V</text><text x="55" y="825" class="s">Servo + both LED sticks</text><path d="M200 755V660" fill="none" stroke="#a06841" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M365 797H625V660" fill="none" stroke="#a06841" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><path d="M625 797H960V660" fill="none" stroke="#a06841" stroke-width="