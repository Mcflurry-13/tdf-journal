ght="normal" fill="#222923">330 Ω</text><path d="M484 410 H585 V240 H620" fill="none" stroke="#397c99" stroke-width="3"/><text x="360" y="82" font-size="19" font-weight="normal" fill="#222923">LED data: A DOUT → B DIN</text><text x="360" y="111" font-size="17" font-weight="normal" fill="#5c645f">B DOUT stays unconnected.</text><rect x="40" y="470" width="230" height="120" rx="8" fill="#f3e4d6" stroke="#baa68f"/><text x="58" y="501" font-size="19" font-weight="bold" fill="#222923">External regulated 5 V</text><text x="58" y="533" font-size="17" font-weight="normal" fill="#222923">Servo and LED supply</text><text x="58" y="568" font-size="17" font-weight="normal" fill="#222923">Common return (GND)</text><path d="M270 500 H960" fill="none" stroke="#bd4f42" stroke-width="3"/><path d="M400 360 V500" fill="none" stroke="#bd4f42" stroke-width="3"/><circle cx="400" cy="500" r="4.5" fill="#bd4f42"/><path d="M640 360 V500" fill="none" stroke="#bd4f42" stroke-width="3"/><circle cx="640" cy="500" r="4.5" fill="#bd4f42"/><path d="M840 360 V500" fill="none" stroke="#bd4f42" stroke-width="3"/><circle cx="840" cy="500" r="4.5" fill="#bd4f42"/><text x="933" y="487" font-size="17" font-weight="normal" fill="#bd4f42">+5 V</text><path d="M270 550 H960" fill="none" stroke="#343b38" stroke-width="3"/><path d="M500 360 V550" fill="none" stroke="#faf9f5" stroke-width="8"/><path d="M500 360 V550" fill="none" stroke="#343b38" stroke-width="3"/><circle cx="500" cy="550" r="4.5" fill="#343b38"/><path d="M700 360 V550" fill="none" stroke="#faf9f5" stroke-width="8"/><path d="M700 360 V550" fill="none" stroke="#343b38" stroke-width="3"/><circle cx="700" cy="550" r="4.5" fill="#343b38"/><path d="M900 360 V550" fill="none" stroke="#faf9f5" stroke-width="8"/><path d="M900 360 V550" fill="none" stroke="#343b38" stroke-width="3"/><circle cx="900" cy="550" r="4.5" fill="#343b38"/><path d="M155 370 V425 H285 V550" fill="none" stroke="#faf9f5" stroke-width="8"/><path d="M155 370 V425 H285 V550" fill="none" stroke="#343b38" stroke-width="3"/><circle cx="285" cy="550" r="4.5" fill="#343b38"/><text x="915" y="578" font-size="17" font-weight="normal" fill="#343b38">GND</text><text x="40" y="626" font-size="22" font-weight="bold" fill="#222923">Power branches are parallel. Only LED data is daisy-chained.</text><text x="40" y="658" font-size="19" font-weight="normal" fill="#222923">USB powers the board; external 5 V does not connect to Feather 3V or BAT.</text><text x="40" y="688" font-size="18" font-weight="normal" fill="#5c645f">Dots mark joins. Wire crossings without a dot are not connected.</text><path d="M40 712 H960" fill="none" stroke="#cdc9bf" stroke-width="2"/><text x="40" y="752" font-size="17" font-weight="normal" fill="#7a8079">01</text><text x="77" y="752" font-size="22" font-weight="bold" fill="#222923">Servo only</text><text x="40" y="789" font-size="18" font-weight="normal" fill="#222923">Disconnect LEDs and linkage.</text><text x="40" y="816" font-size="18" font-weight="normal" fill="#222923">Check pulses and wiring.</text><text x="362" y="752" font-size="17" font-weight="normal" fill="#7a8079">02</text><text x="399" y="752" font-size="22" font-weight="bold" fill="#222923">LEDs only</text><text x="362" y="789" font-size="18" font-weight="normal" fill="#222923">Repair the stick connections.</text><text x="362" y="816" font-size="18" font-weight="normal" fill="#222923">Check each stick’s response.</text><text x="684" y="752" font-size="17" font-weight="normal" fill="#7a8079">03</text><text x="721" y="752" font-size="22" font-weight="bold" fill="#222923">Reconnect</text><text x="684" y="789" font-size="18" font-weight="normal" fill="#222923">Restore the servo, then linkage.</text><text x="684" y="816" font-size="18" font-weight="normal" fill="#222923">Adjust opening with the load.</text></g></svg>