<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 810" role="img" aria-labelledby="title desc"><title id="title">Ambient Display electrical schematic</title><desc id="desc">External 5 volt DC power supplies the MG90S and two NeoPixel modules in parallel. The Feather is powered by computer USB. All grounds join. GPIO14 controls the servo; GPIO27 passes through a 330 ohm resistor to stick A DIN; A DOUT connects to B DIN. B DOUT is unconnected.</desc><rect width="1160" height="810" fill="#fcfbf8"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#242825}.wire{fill:none;stroke:#343b37;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.part{fill:#fcfbf8;stroke:#343b37;stroke-width:2.2}.note{fill:#606961}</style>
