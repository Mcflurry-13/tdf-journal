<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img"><title>System overview: Sunsethue and browser feed the Mac, USB connects the ESP32, and servo and LEDs produce flower movement and light.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#626862" stroke-width="1.4"/></marker></defs><rect width="1200" height="850" fill="#faf9f6"/><g font-family="Arial, Helvetica, sans-serif" fill="#232823"><text x="44" y="50" font-size="30" font-weight="bold" fill="#232823">System overview</text><rect x="638" y="32" width="16" height="16" fill="#ece9f3" stroke="#b5b7ad"/><text x="663" y="47" font-size="17" font-weight="normal" fill="#232823">Software</text><rect x="815" y="32" width="16" height="16" fill="#e3ece5" stroke="#b5b7ad"/><text x="840" y="47" font-size="17" font-weight="normal" fill="#232823">Electronics</text><rect x="1009" y="32" width="16" height="16" fill="#f3e6d9" stroke="#b5b7ad"/><text x="1034" y="47" font-size="17" font-weight="normal" fill="#232823">Mechanics</text><text x="44" y="112" font-size="15" font-weight="bold" fill="#73786f">INPUT</text><rect x="44" y="136" width="270" height="142" fill="#ece9f3" stroke="#bcb5cc" stroke-width="1.2"/><text x="66" y="173" font-size="25" font-weight="bold" fill="#232823">Sunsethue</text><text x="66" y="212" font-size="20" font-weight="normal" fill="#232823">• Berkeley sunset forecast</text><text x="66" y="241" font-size="20" font-weight="normal" fill="#232823">• Quality score: 0–100</text><rect x="435" y="136" width="330" height="142" fill="#ece9f3" stroke="#bcb5cc" stroke-width="1.2"/><text x="457" y="173" font-size="25" font-weight="bold" fill="#232823">Mac · Python service</text><text x="457" y="212" font-size="20" font-weight="normal" fill="#232823">• Fetches forecast data</text><text x="457" y="241" font-size="20" font-weight="normal" fill="#232823">• Sends device commands</text><rect x="886" y="136" width="270" height="142" fill="#ece9f3" stroke="#bcb5cc" stroke-width="1.2"/><text x="908" y="173" font-size="25" font-weight="bold" fill="#232823">Browser interface</text><text x="908" y="212" font-size="20" font-weight="normal" fill="#232823">• Shows score and motion</text><text x="908" y="241" font-size="20" font-weight="normal" fill="#232823">• Hold, Breathe, Stop</text><path d="M314 207 H433" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="336" y="189" font-size="16" font-weight="normal" fill="#232823">HTTPS</text><path d="M886 207 H767" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="797" y="189" font-size="16" font-weight="normal" fill="#232823">HTTP</text><path d="M600 278 V368" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="619" y="327" font-size="17" font-weight="normal" fill="#232823">USB serial</text><text x="44" y="378" font-size="15" font-weight="bold" fill="#73786f">CONTROL</text><rect x="435" y="371" width="330" height="145" fill="#e3ece5" stroke="#acbeb0" stroke-width="1.2"/><text x="457" y="408" font-size="25" font-weight="bold" fill="#232823">Feather ESP32 V2</text><text x="457" y="447" font-size="20" font-weight="normal" fill="#232823">• Runs Arduino firmware</text><text x="457" y="476" font-size="20" font-weight="normal" fill="#232823">• Maps score to the outputs</text><path d="M435 444 H179 V623" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="197" y="429" font-size="17" font-weight="normal" fill="#232823">Servo control</text><path d="M765 444 H1021 V623" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="822" y="429" font-size="17" font-weight="normal" fill="#232823">Pixel data</text><text x="44" y="591" font-size="15" font-weight="bold" fill="#73786f">OUTPUT</text><rect x="44" y="626" width="270" height="145" fill="#e3ece5" stroke="#acbeb0" stroke-width="1.2"/><text x="66" y="663" font-size="25" font-weight="bold" fill="#232823">MG90S servo</text><text x="66" y="702" font-size="20" font-weight="normal" fill="#232823">• Turns the horn</text><text x="66" y="731" font-size="20" font-weight="normal" fill="#232823">• Moves the wire linkage</text><rect x="435" y="626" width="330" height="145" fill="#f3e6d9" stroke="#cbb79e" stroke-width="1.2"/><text x="457" y="663" font-size="25" font-weight="bold" fill="#232823">Printed petals</text><text x="457" y="702" font-size="20" font-weight="normal" fill="#232823">• Two layers linked at tips</text><text x="457" y="731" font-size="20" font-weight="normal" fill="#232823">• Center movement opens them</text><rect x="886" y="626" width="270" height="145" fill="#e3ece5" stroke="#acbeb0" stroke-width="1.2"/><text x="908" y="663" font-size="25" font-weight="bold" fill="#232823">NeoPixel sticks</text><text x="908" y="702" font-size="20" font-weight="normal" fill="#232823">• Two eight-pixel sticks</text><text x="908" y="731" font-size="20" font-weight="normal" fill="#232823">• Color follows the score</text><path d="M314 699 H433" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="332" y="679" font-size="17" font-weight="normal" fill="#232823">Wire pull</text><path d="M886 699 H767" fill="none" stroke="#626862" stroke-width="2" marker-end="url(#arrow)"/><text x="804" y="679" font-size="17" font-weight="normal" fill="#232823">Light</text></g></svg>