<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="865" viewBox="0 0 1000 865" role="img"><title>Hold and Breathe encode different things</title><desc>Hold maps forecast score to command angle, saturating at 60 points. Breathe is a fixed 5 to 150 degree motion demonstration. Angles are commands, not measured petal positions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#252925"/></marker></defs><rect width="100%" height="100%" fill="#f6f5f1"/><style>text{font-family:Arial,sans-serif;fill:#242824}.s{font-size:21px;fill:#555c56}.t{font-size:27px;font-weight:600}.k{font-size:19px;letter-spacing:2px;fill:#60675f}</style><text x="35" y="43" class="k">02 / TWO MODES, TWO MEANINGS</text><text x="35" y="91" class="t">Hold · forecast → still opening</text><text x="35" y="125" class="s">Angle = 5° + min(score / 60, 1) × 160°</text><path d="M95.0 175V415" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="85.0" y="446" class="s">0</text><path d="M259.0 175V415" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="249.0" y="446" class="s">20</text><path d="M423.0 175V415" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="413.0" y="446" class="s">40</text><path d="M587.0 175V415" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="577.0" y="446" class="s">60</text><path d="M751.0 175V415" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="741.0" y="446" class="s">80</text><path d="M915.0 175V415" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="905.0" y="446" class="s">100</text><path d="M95 415.0H915" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="35" y="422.0" class="s">5°</text><path d="M95 297.5H915" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="35" y="304.5" class="s">85°</text><path d="M95 180.0H915" fill="none" stroke="#dbddd6" stroke-width="2.2"/><text x="35" y="187.0" class="s">165°</text><path d="M95 180V415H915" fill="none" stroke="#252925" stroke-width="2.2"/><polyline points="95,415 587,180 915,180" fill="none" stroke="#5b735a" stroke-width="5"/><circle cx="414.8" cy="262.25" r="7" fill="#b5793d"/><text x="125" y="225" class="s">39 → 109° (Oct 15 example)</text><text x="622" y="164" class="s">60+ → 165°</text><text x="590" y="480" class="s">Forecast quality score / 100</text><text x="35" y="533" class="t">Breathe · motion demonstration</text><text x="35" y="567" class="s">5° → 150° → 5° · independent of forecast score</text><rect x="35" y="589" width="310" height="55" fill="#e4e9e1" stroke="#858980"/><text x="47" y="624" class="s">Open · 3 s</text><rect x="345" y="589" width="155" height="55" fill="#eeede7" stroke="#858980"/><text x="357" y="624" class="s">Pause · 1.5 s</text><rect x="500" y="589" width="310" height="55" fill="#e4e9e1" stroke="#858980"/><text x="512" y="624" class="s">Close · 3 s</text><rect x="810" y="589" width="155" height="55" fill="#eeede7" stroke="#858980"/><text x="822" y="624" class="s">Pause · 1.5 s</text><text x="35" y="691" class="s">Light color follows quality in both modes. Brightness follows opening.</text><rect x="35" y="714" width="300" height="55" fill="#e9ce75"/><text x="52" y="749" class="s">Below 33 · yellow</text><rect x="335" y="714" width="300" height="55" fill="#d99b5c"/><text x="352" y="749" class="s">33 to &lt;67 · orange</text><rect x="635" y="714" width="330" height="55" fill="#cf7b6c"/><text x="652" y="749" class="s">67–100 · red</text><text x="35" y="825" class="s">Command angles describe software targets, not measured petal angles.</text></svg>